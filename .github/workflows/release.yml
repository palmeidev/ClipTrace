name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release ClipTrace
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev"
          fi
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "Target version: ${VER}"

      - name: Build Release (x64)
        run: |
          msbuild ClipTrace.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /t:Rebuild

      - name: Sign Binary (Authenticode)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Pablo Almeida" -KeySpec Signature -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5) -CertStoreLocation "Cert:\CurrentUser\My"
          $pwd = ConvertTo-SecureString "ClipTrace" -AsPlainText -Force
          $pfxPath = "$env:TEMP\cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd
          
          # Locate signtool
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfxPath /p "ClipTrace" /tr http://timestamp.digicert.com /td SHA256 "x64\Release\ClipTrace.exe"
          Remove-Item $pfxPath -Force

      - name: Package Artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "x64\Release\ClipTrace.exe" -Destination "dist\ClipTrace.exe"
          Compress-Archive -Path "dist\ClipTrace.exe" -DestinationPath "dist\ClipTrace-$ver-win64.zip"

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ClipTrace-${{ steps.version.outputs.VERSION }}-win64
          path: |
            dist/ClipTrace.exe
            dist/ClipTrace-*.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ClipTrace ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: .github/release-notes/${{ steps.version.outputs.VERSION }}.md
          files: |
            dist/ClipTrace.exe
            dist/ClipTrace-*.zip
